services:
  mysql:
    image: mysql:5.7
    container_name: prestashop-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: prestashop
      MYSQL_USER: prestashop
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - proxy
  prestashop:
    image: prestashop/prestashop:latest
    container_name: prestashop
    restart: always
    depends_on:
      - mysql
    environment:
      PRESTASHOP_DATABASE_HOST: mysql
      PRESTASHOP_DATABASE_NAME: prestashop
      PRESTASHOP_DATABASE_USER: prestashop
      PRESTASHOP_DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      PS_DEV_MODE: 1
      PS_INSTALL_AUTO: 0
      PS_SSL_ENABLED: 0
      PS_SSL_ENABLED_EVERYWHERE: 0
    ports:
      - "8085:80"
    volumes:
      - html_data:/var/www/html
    networks:
      - proxy
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_USER: prestashop
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8081:80"
    networks:
      - proxy
volumes:
  mysql_data:
    external: true
    name: prestashop_mysql_data
  html_data:
    external: true
    name: prestashop_html_data
networks:
  proxy:
    external: true
